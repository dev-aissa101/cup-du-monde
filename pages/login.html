<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Cup 2030 | Morocco - Portugal - Spain</title>
    <meta
      name="description"
      content="Log in to your World Cup 2030 fan account."
    />
    <meta name="theme-color" content="#050914" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="World Cup 2030" />
    <meta property="og:title" content="Log In | World Cup 2030" />
    <meta
      property="og:description"
      content="Log in to your World Cup 2030 fan account."
    />
    <meta property="og:url" content="https://aissadev108.netlify.app/pages/login.html" />
    <meta property="og:image" content="https://aissadev108.netlify.app/images/backgrounds/background.webp" />
    <link rel="icon" type="image/png" href="../images/logos/logofifa.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <script src="../js/site.js" defer></script>
    <script src="../js/login.js" defer></script>
  </head>

  <body data-nav-active="login" class="login-page">
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Shared header: unchanged from the other pages -->
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="../index.html" aria-label="World Cup 2030 home">
          <span class="brand-mark" aria-hidden="true"><i class="fa-solid fa-trophy"></i></span>
          <span class="brand-text">WORLD CUP <strong>2030</strong></span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
          <ul class="nav-list">
            <li><a class="nav-link" href="../index.html" data-nav="home">Home</a></li>
            <li><a class="nav-link" href="../index.html#about" data-nav="about">About</a></li>
            <li><a class="nav-link" href="../index.html#stadiums" data-nav="stadiums">Stadiums</a></li>
            <li><a class="nav-link" href="../index.html#contact" data-nav="contact">Contact</a></li>
            <li><a class="nav-login" href="login.html" data-nav="login">Log In</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Log In</h1>

        <!-- novalidate lets JS show one short, accessible message instead of browser tooltips -->
        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="identifier">Email or username</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              placeholder="you@example.com"
              autocomplete="username"
              aria-describedby="form-error"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              aria-describedby="form-error"
              minlength="6"
              required
            />
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>
          <button class="btn btn-primary login-submit" type="submit">Log In</button>
        </form>

        <p class="signup">
          Don't have an account?
          <!-- TODO: replace with your real sign-up page or email. -->
          <a href="mailto:support@example.com?subject=Sign%20up%20request">Sign up</a>
        </p>
      </section>
    </main>
  </body>
</html>
